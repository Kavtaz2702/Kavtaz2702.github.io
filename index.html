<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3efe4;
    --panel: #ebe6d8;
    --ink: #1b1a17;
    --muted: #6f6a5d;
    --line: #1b1a17;
    --soft: #cfc8b4;
    --grid: rgba(27, 26, 23, .055);
    --accent: #d9480f;
  }
  :root[data-theme="crt"] {
    --paper: #0a0e0a;
    --panel: #0f150f;
    --ink: #b9f5b2;
    --muted: #6aa266;
    --line: #2f5a2d;
    --soft: #1d341c;
    --grid: rgba(120, 220, 110, .06);
    --accent: #ffb000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
    color: var(--ink);
    font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    font-size: 15px;
    line-height: 1.65;
    transition: background-color .3s, color .3s;
  }
  a { color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  .px { font-family: "VT323", "IBM Plex Mono", monospace; font-weight: 400; }

  /* top bar */
  nav { position: sticky; top: 0; z-index: 10; background: var(--paper); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 54px; gap: 12px; }
  .logo { font-size: 26px; text-decoration: none; }
  .links { display: flex; align-items: center; gap: 20px; font-size: 13px; }
  .links a { text-decoration: none; }
  .links a:hover { color: var(--accent); }
  #theme {
    font: inherit; font-size: 12px; color: var(--ink); background: transparent;
    border: 1px solid var(--line); padding: 3px 10px; cursor: pointer;
  }
  #theme:hover { background: var(--ink); color: var(--paper); }

  /* hero */
  header { padding: 64px 0 40px; }
  .hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; align-items: center; }
  .status { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; flex: none; }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 { font-size: clamp(52px, 9vw, 88px); line-height: .9; margin: 14px 0 10px; letter-spacing: 1px; }
  .role { font-size: 17px; font-weight: 500; }
  .pitch { color: var(--muted); margin-top: 12px; max-width: 470px; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
  .btn {
    display: inline-block; text-decoration: none; font-size: 14px; font-weight: 500;
    padding: 10px 18px; border: 1px solid var(--line); background: var(--paper);
    box-shadow: 4px 4px 0 var(--line); transition: transform .1s, box-shadow .1s;
  }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--line); }
  .btn:active { transform: translate(4px, 4px); box-shadow: none; }
  .btn.primary { background: var(--accent); color: #fff; }
  :root[data-theme="crt"] .btn.primary { color: #0a0e0a; }

  .scope { border: 1px solid var(--line); background: var(--panel); box-shadow: 6px 6px 0 var(--line); }
  .scope-bar { display: flex; justify-content: space-between; font-size: 11px; padding: 5px 10px; border-bottom: 1px solid var(--line); letter-spacing: 1px; }
  .scope canvas { display: block; width: 100%; height: 230px; }
  .scope-foot { display: flex; justify-content: space-between; font-size: 11px; padding: 5px 10px; border-top: 1px solid var(--line); color: var(--muted); }

  /* headline numbers */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--paper); margin-top: 48px; }
  .stat { padding: 14px 16px; border-right: 1px solid var(--line); }
  .stat:last-child { border-right: 0; }
  .stat b { display: block; font-size: 44px; line-height: 1; color: var(--accent); font-weight: 400; }
  .stat span { font-size: 12.5px; color: var(--muted); display: block; margin-top: 4px; line-height: 1.4; }

  /* sections */
  section { padding: 52px 0; }
  .trace { display: block; width: 100%; height: 22px; color: var(--line); }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 26px; }
  .head .num { font-size: 30px; color: var(--accent); }
  h2 { font-size: 44px; line-height: 1; letter-spacing: 1px; }
  .lead { max-width: 660px; }

  /* spec table */
  table { width: 100%; border-collapse: collapse; margin-top: 24px; background: var(--paper); }
  th, td { text-align: left; padding: 9px 12px; border: 1px solid var(--soft); vertical-align: top; }
  th { width: 190px; font-weight: 500; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); background: var(--panel); }

  /* projects */
  .proj { border: 1px solid var(--line); background: var(--paper); margin-bottom: 22px; transition: box-shadow .15s, transform .15s; }
  .proj:hover { box-shadow: 6px 6px 0 var(--line); transform: translate(-2px, -2px); }
  .proj-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12px; letter-spacing: 1px; }
  .proj-top a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .proj-top a:hover { text-decoration: underline; }
  .proj img { display: block; width: 100%; max-height: 360px; object-fit: cover; border-bottom: 1px solid var(--line); }
  .proj-body { padding: 18px 14px 16px; }
  .proj h3 { font-size: 30px; line-height: 1.05; font-weight: 400; }
  .proj .sum { color: var(--muted); margin: 6px 0 14px; max-width: 660px; }
  .cols { display: grid; grid-template-columns: 1fr 1.5fr 1.2fr; border: 1px solid var(--soft); }
  .cols div { padding: 10px 12px; border-right: 1px solid var(--soft); font-size: 14px; }
  .cols div:last-child { border-right: 0; }
  .cols b { display: block; font-size: 11px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { font-size: 12px; padding: 1px 8px; border: 1px solid var(--soft); }

  /* results */
  .res { display: grid; grid-template-columns: 120px 1fr 56px; gap: 16px; align-items: baseline; padding: 12px 0; border-top: 1px solid var(--soft); }
  .res:last-child { border-bottom: 1px solid var(--soft); }
  .res .place { font-size: 30px; line-height: 1; color: var(--accent); }
  .res h3 { font-size: 15px; font-weight: 600; }
  .res p { color: var(--muted); font-size: 13.5px; }
  .res time { font-size: 13px; text-align: right; color: var(--muted); }

  /* history */
  .row { display: grid; grid-template-columns: 170px 1fr; gap: 20px; padding: 16px 0; border-top: 1px solid var(--soft); }
  .row:last-child { border-bottom: 1px solid var(--soft); }
  .row time { font-size: 13px; color: var(--accent); padding-top: 3px; }
  .row h3 { font-size: 16px; font-weight: 600; }
  .row .where { color: var(--muted); font-size: 13px; }
  .row p { margin-top: 4px; max-width: 640px; }

  /* contact */
  .contact { text-align: center; padding-bottom: 72px; }
  .contact h2 { font-size: clamp(48px, 9vw, 84px); }
  .contact p { color: var(--muted); max-width: 480px; margin: 10px auto 26px; }
  .contact .cta { justify-content: center; }
  footer { border-top: 1px solid var(--line); padding: 18px 0; font-size: 12px; color: var(--muted); text-align: center; }

  .reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s, transform .6s; }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stat:nth-child(2) { border-right: 0; }
    .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
    .cols { grid-template-columns: 1fr; }
    .cols div { border-right: 0; border-bottom: 1px solid var(--soft); }
    .cols div:last-child { border-bottom: 0; }
    .row { grid-template-columns: 1fr; gap: 2px; }
    .res { grid-template-columns: 84px 1fr; }
    .res time { display: none; }
    th { width: 110px; }
    .links { gap: 14px; }
    .links a.hide-sm { display: none; }
    header { padding: 40px 0 28px; }
    h2 { font-size: 36px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .led { animation: none; }
  }
</style>
</head>

};

const root = document.documentElement, themeBtn = $("theme");
function setTheme(t) {
  if (t === "crt") root.dataset.theme = "crt"; else delete root.dataset.theme;
  themeBtn.textContent = t === "crt" ? "PAPER" : "CRT";
  try { localStorage.setItem("theme", t); } catch (e) {}
  readColours();
}
themeBtn.addEventListener("click", () => setTheme(root.dataset.theme === "crt" ? "paper" : "crt"));

/* oscilloscope: move the mouse over it to change the frequency */
const cv = $("wave"), ctx = cv.getContext("2d");
let col = {}, W = 0, H = 0, cycles = 3, target = 3, phase = 0;
function readColours() {
  const s = getComputedStyle(root);
  col = { grid: s.getPropertyValue("--soft").trim(), wave: s.getPropertyValue("--accent").trim(), axis: s.getPropertyValue("--muted").trim() };
}
function resize() {
  const d = Math.min(devicePixelRatio || 1, 2), r = cv.getBoundingClientRect();
  W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.lineWidth = 1; ctx.strokeStyle = col.grid;
  for (let i = 1; i < 10; i++) { const x = W * i / 10; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let i = 1; i < 6; i++)  { const y = H * i / 6;  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.strokeStyle = col.axis; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke(); ctx.setLineDash([]);

  cycles += (target - cycles) * 0.08;
  ctx.strokeStyle = col.wave; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= W; x += 2) {
    const t = x / W * cycles * Math.PI * 2 + phase;
    const y = H / 2 - (Math.sin(t) + 0.22 * Math.sin(3 * t)) * H * 0.27;
    x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  $("freq").textContent = (cycles / 3).toFixed(2) + " kHz";
}
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
function loop() { phase -= 0.04; draw(); if (!still) requestAnimationFrame(loop); }
cv.addEventListener("mousemove", e => { const r = cv.getBoundingClientRect(); target = 1 + (e.clientX - r.left) / r.width * 7; });
cv.addEventListener("mouseleave", () => target = 3);
addEventListener("resize", () => { resize(); if (still) draw(); });

let saved = "paper";
try { saved = localStorage.getItem("theme") || "paper"; } catch (e) {}
setTheme(saved); resize(); loop();
</script>
</body>
</html>
